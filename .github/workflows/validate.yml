name: Valida canvis de la PWA
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/iphone-pwa-data-safety]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
